<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070F"/>
      <stop offset="50%" stop-color="#091528"/>
      <stop offset="100%" stop-color="#040A14"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Full-Bleed Background & Grid -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Subtle Radar Rings -->
  <circle cx="600" cy="200" r="150" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 6">
    <animateTransform attributeName="transform" type="rotate" from="0 600 200" to="360 600 200" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="200" r="240" fill="none" stroke="#00FF9D" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="12 10">
    <animateTransform attributeName="transform" type="rotate" from="360 600 200" to="0 600 200" dur="45s" repeatCount="indefinite"/>
  </circle>

  <!-- Live Sweeping Radar Scan Line -->
  <rect x="0" y="-50" width="1200" height="50" fill="url(#scanBeam)">
    <animate attributeName="y" from="-50" to="420" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated HUD Corner Brackets -->
  <path d="M 28 76 L 28 28 L 84 28" fill="none" stroke="#00F0FF" stroke-width="3.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 1116 28 L 1172 28 L 1172 76" fill="none" stroke="#00F0FF" stroke-width="3.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 28 324 L 28 372 L 84 372" fill="none" stroke="#00FF9D" stroke-width="3.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 1116 372 L 1172 372 L 1172 324" fill="none" stroke="#00FF9D" stroke-width="3.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Top Telemetry Strip -->
  <text x="56" y="56" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#00F0FF" fill-opacity="0.75">SYS_ID: EMOJIWORLD777</text>
  <text x="1144" y="56" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#00FF9D" fill-opacity="0.75">NIT DELHI // M.TECH</text>

  <!-- Status Badge with Pulsing LED -->
  <rect x="435" y="72" width="330" height="30" rx="15" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-opacity="0.55" stroke-width="1.2"/>
  <circle cx="458" cy="87" r="5" fill="#00FF9D">
    <animate attributeName="r" values="4;7;4" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="608" y="92" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#00F0FF" letter-spacing="2">OPERATOR // SATVIK NAGAR</text>

  <!-- Main Name -->
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" letter-spacing="4">SATVIK <tspan fill="url(#neon)">NAGAR</tspan></text>

  <!-- Role -->
  <text x="600" y="244" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#A8C7E0" letter-spacing="2">DATA SCIENTIST  •  COMPUTER VISION  •  AIoT &amp; DATA ENGINEERING</text>

  <!-- Bottom Telemetry Bar -->
  <line x1="120" y1="296" x2="1080" y2="296" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="260" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00FF9D">LOC: INDIA</text>
  <text x="600" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00F0FF">STACK: PYTHON • YOLO • ANPR • SQL/NoSQL</text>
  <text x="940" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#00FF9D">STATUS: ONLINE
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>
